<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Тренировка JS</h1>
<div id="content"></div>
<button>Клик</button>
<button id="money">Дать денег</button>
<button id="server">Сходить на сервер</button>
<script>
    const mybutton = document.querySelector('button')
    const money = document.querySelector('#money')
    const server = document.querySelector('#server')

    console.log(mybutton)

    mybutton.onclick = function (){
        const mydiv = document.querySelector('#content')
        mydiv.textContent = 'Дай денег'
    }

    money.onclick = function (){
        const mydiv = document.querySelector('#content')
        mydiv.textContent = 'Спасибо! 🧡🧡🧡'
    }

    server.onclick = function (){
            fetch('http://127.0.0.1:8000/get_data')
            .then(res => res.json())
            .then(console.log)
        }


</script>
</body>
</html>
