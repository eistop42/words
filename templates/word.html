<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Изучение слов</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f6f7f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 700px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .menu a {
            margin-right: 15px;
            text-decoration: none;
            color: #0077cc;
            font-weight: 500;
        }

        input {
            padding: 10px;
            width: 45%;
            margin-right: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #0077cc;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #005fa3;
        }

        .word-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }

        .word-item a {
            text-decoration: none;
            color: #333;
        }

        .learned {
            color: #999;
        }

        form input {
            margin-bottom: 10px;
            margin-top: 10px;
            display: block;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }

        .note {
            background: #f1f1f1;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .button-form {
            display: inline-block;
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Словарь для изучения</h1>

        <div class="card menu">
            <a href="/">Главная</a>
            <a href="?status=learned">Изученные</a>
        </div>

      

<div class="card">
    <h2 id="wordTitle">{{ word.slovo }}</h2>
    <h2 id="translation">{{  word.perevod }}</h2>
    <p>Статус: {{ word.get_status_display }}</p>

    {% if word.status != 'izucheno' %}
    <div class="button-form">
        <form method="post" action="{% url 'word_izucheno' word.id %}">
            {% csrf_token %}
            <button>Отметить изученным</button>
        </form>
    </div>
    {% else %}
    <div class="button-form">
        <form method="post" action="{% url 'word_na_izuchenii' word.id %}">
            {% csrf_token %}
            <button>Вернуть на изучение</button>
        </form>
    </div>
    {% endif %}
    <div class="button-form">
        <form method="post" action="{% url 'delete_word' word.id %}">
            {% csrf_token %}
            <button>Удалить</button>
        </form>
    </div>
</div>

<div class="card">
    <h3>Заметки</h3>
    <form id="noteForm" method="post">
        <input type="hidden" name="csrfmiddlewaretoken" value="uPM9FS3PwGNasQw0TEDUUIe8QGS11TSMJ3h88TweG3NdUGD4PD9UF5m2ZAoS9U7E">
        <div>
    <label for="id_note">заметка:</label>



<textarea name="note" cols="40" rows="4" placeholder="Введите заметку здесь..." required id="id_note">
</textarea>
    
      
    
</div>
        <button type="submit">Добавить</button>
    </form>
    <div id="notes">
        
        <div class="note">ыфва</div>
        
        <div class="note">ыфва</div>
        
        <div class="note">хорошее слово</div>
        
    </div>
</div>



    </div>

</body>

</html>
